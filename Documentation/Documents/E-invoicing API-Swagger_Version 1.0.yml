openapi: 3.0.0
info:
  title: E-Invoicing Sandbox APIs
  version: 1.0.0
servers:
  - url: 'https://apigw.e-invoice.gov.bh'

paths:

  /v1/sandbox/devices/compliance:
    post:
      tags:
        - Sandbox
      summary: Compliance CSID
      description: >
        An initial device onboarding request for an E-invoicing solution by providing an OTP code and CSR information for each device onboarding or renewal request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              csr: 
      parameters:
        - name: OTP
          in: header
          schema:
            type: integer
          example: '373727'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateSuccessResponse'
              example:
                requestID: 1234567890123
                dispositionMessage: ISSUED
                binarySecurityToken: 
                secret: p+4MfORNO4lYgP/RcpWz4riSQehkjPqArXOJglj1r/s=
                errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFailResponse'
              example:
                statusCode: 400
                errorName: Decode-Failure
                message: System failed to process your request
  
  /v1/sandbox/invoices/compliance:
    post:
      tags:
        - Sandbox
      summary: Compliance Check
      description: >
        A request to complete the compliance checks for different type of E-invoices enabling the E-invoicing Solution Developers to be able to test compliance of their E-invoicing solutions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              invoiceHash: KFZisoR2U/PN0lfvhE8p96Gl4dZt5opFGnjHDyATckg=
              uuid: 28f9297f-3396-4bff-bd55-e6bf241f0e8a
              invoice: 
      security:
        - basicAuthCCSID: []
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
          example: en
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResponse'
              example:
                validationResults:
                  infoMessages: [{
                      type: INFO,
                      code: VLD.REPORTING.C.001,
                      category: SUCCESS_REPORTING_INVOICE,
                      message: The submitted test invoice is accepted,
                      status: INFO
                    }]
                  errorMessages: []
                  warningMessages: []
                  status: PASS
                reportingStatus: REPORTED
                clearanceStatus: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceResponse'
              example:
                validationResults:
                  infoMessages: []
                  errorMessages: [{
                      type: ERROR,
                      code: VLD.SCHEMATRON.E.001,
                      category: SCHEMATRON_ERROR,
                      message: "[BR-BH-18]-Either Supply Date (BT-072) or Payment Date (BT-BH-029) must be provided if it is  different than the Document Issue Date (BT-002)",
                      status: ERROR
                    }]
                  warningMessages: []
                  status: ERROR
                reportingStatus: NOT_REPORTED
                clearanceStatus: null
  
  /v1/sandbox/devices/production:
    post:
      tags:
        - Sandbox
      summary: Production CSID
      description: >
        A final request to obtain the Production CSID for the E-invoicing solution linked to the authorized VAT payer to commence submitting E-invoices for Clearance and Reporting.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              compliance_request_id: '1234567890123'
      security:
        - basicAuthCCSID: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateSuccessResponse'
              example:
                requestID: 30368
                dispositionMessage: Validations have passed and a dummy PCSID has been successfully generated
                binarySecurityToken: 
                secret: yhuIq6qFEHn98jJzzE36+o/Gp56q5QeXF2FSfkBWCFQ=
                errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFailResponse'
              example:
                statusCode: 400,
                errorName: Incorrect-ComplianceRequestId
                message: API Request validation has failed as one or more API parameters are invalid
  
  /v1/sandbox/devices/renew:
    patch:
      tags:
        - Sandbox
      summary: CSID Renewal
      description: >
        A request for device certificate renewal for an E-invoicing solution by submitting an existing production certificate and CSR. The request is accompanied with the OTP generated by the VAT Payer linked to the device.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              csr: 
      security:
        - basicAuthPCSID: []
      parameters:
        - name: OTP
          in: header
          schema:
            type: integer
          example: '138736'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateSuccessResponse'
              example:
                requestID: 1234567890123
                dispositionMessage: ISSUED
                binarySecurityToken: 
                secret: p+4MfORNO4lYgP/RcpWz4riSQehkjPqArXOJglj1r/s=
                errors: null
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateFailResponse'
              example:
                statusCode: 400
                errorName: Decode-Failure
                message: System failed to process your request
  
  /v1/sandbox/invoices/clearance:
    post:
      tags:
        - Sandbox
      summary: Clearance
      description: >
        The process of validating and signing the standard E-invoice document and associated credit notes and debit notes and simulates the validation checks applied to the Clearance process.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              invoiceHash: 7PrG8lBZREsomdK1ftF4QoMglQfOfVqQ/Hd8K2zrg20=
              uuid: 28f9297f-3396-4bff-bd55-e6bf241f0e8a
              invoice: 
      security:
        - basicAuthPCSID: []
      parameters:
        - name: accept-language
          in: header
          schema:
            type: string
          example: en
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref : '#/components/schemas/ClearanceResult'
              example:
                validationResults:
                  infoMessages: [{
                      type: INFO,
                      code: VLD.CLEARANCE.C.001,
                      category: SUCCESS_CLEARANCE_INVOICE,
                      message: The submitted test invoice is accepted,
                      status: INFO
                    }]
                  errorMessages: []
                  warningMessages: []
                  status: PASS
                clearanceStatus: CLEARED
                clearedInvoice: 
                qrCode: 
                timestamp: "2026-01-15T23:38:11.711335671"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref : '#/components/schemas/ClearanceResult'
              example:
                validationResults:
                  infoMessages: []
                  errorMessages: [{
                      type: ERROR,
                      code: VLD.SCHEMATRON.E.001,
                      category: SCHEMATRON_ERROR,
                      message: "[BR-BH-18]-Either Supply Date (BT-072) or Payment Date (BT-BH-029) must be provided if it is  different than the Document Issue Date (BT-002)",
                      status: ERROR
                    }]
                  warningMessages: []
                  status: ERROR
                clearanceStatus: NOT_CLEARED
                clearedInvoice: null
                qrCode: null
                timestamp: "2026-01-15T23:38:11.711335671"
  
  /v1/sandbox/invoices/reporting:
    post:
      tags:
        - Sandbox
      summary: Reporting
      description: >
        The process of validating the simplified E-invoices and associated credit notes and debit notes and simulates the validation checks applies to the Reporting process.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              invoiceHash: KFZisoR2U/PN0lfvhE8p96Gl4dZt5opFGnjHDyATckg=
              uuid: 28f9297f-3396-4bff-bd55-e6bf241f0e8a
              invoice: 
      security:
        - basicAuthPCSID: []
      parameters:
        - name: accept-language
          in: header
          schema:
            type: string
          example: en
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingResult"
              example:
                validationResults:
                  infoMessages: [{
                      type: INFO,
                      code: VLD.REPORTING.C.001,
                      category: SUCCESS_REPORTING_INVOICE,
                      message: The submitted test invoice is accepted,
                      status: INFO
                    }]
                  errorMessages: []
                  warningMessages: []
                  status: PASS
                reportingStatus: REPORTED
                timestamp: "2026-01-15T23:38:11.711335671"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingResult"
              example:
                validationResults:
                  infoMessages: []
                  errorMessages: [{
                      type: ERROR,
                      code: VLD.SCHEMATRON.E.001,
                      category: SCHEMATRON_ERROR,
                      message: "[BR-BH-18]-Either Supply Date (BT-072) or Payment Date (BT-BH-029) must be provided if it is  different than the Document Issue Date (BT-002)",
                      status: ERROR
                    }]
                  warningMessages: []
                  status: ERROR
                reportingStatus: NOT_REPORTED
                timestamp: "2026-01-15T23:38:11.711335671"
  
components:

  schemas:

    CertificateSuccessResponse:
      type: object
      properties:
        requestID:
          type: integer
          format: int64
          description: Unique identifier for the request
        dispositionMessage:
          $ref: '#/components/schemas/dispositionMessage'
          description: Disposition message object
        binarySecurityToken:
          type: string
          description: Binary security token string
        secret:
          type: string
          description: Secret string
        errors:
          type: array
          items:
            type: string
          description: List of error messages
      required:
        - requestID
        - dispositionMessage
    
    CertificateFailResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int64
          description: Unique identifier for the request
        errorName:
          type: string
          description: Unique identifier for the request
        message:
          type: string
          description: Unique identifier for the request
      required:
        - statusCode
        - errorName
        - message

    dispositionMessage:
      type: string
      enum:
        - ISSUED
        - REVOKED
        - NOT_COMPLIANT
      description: Disposition message status

    ComplianceResponse:
      type: object
      properties:
        ValidationResult:
          $ref: '#/components/schemas/ValidationResult'
        reportingStatus:
          $ref: '#/components/schemas/ReportingStatus'
        clearanceStatus:
          $ref: '#/components/schemas/ClearanceStatus'
      required:
        - ValidationResult
        - reportingStatus
        - clearanceStatus

    ClearanceResult:
      type: object
      properties:
        ValidationResult:
          $ref: '#/components/schemas/ValidationResult'
          description: Validation results object
        clearanceStatus:
          $ref: '#/components/schemas/ClearanceStatus'
          description: Clearance status of the invoice
        clearedInvoice:
          type: string
          description: The cleared invoice document as a string (e.g., XML or JSON)
        qrCode:
          type: string
          description: QR code string related to the invoice
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the clearance result
      required:
        - ValidationResult
        - clearanceStatus
        - clearedInvoice
        - qrCode
        - timestamp

    ReportingResult:
      type: object
      properties:
        ValidationResult:
          $ref: '#/components/schemas/ValidationResult'
          description: Validation results object
        reportingStatus:
          $ref: '#/components/schemas/ReportingStatus'
          description: Reporting status of the invoice
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the reporting result
      required:
        - ValidationResult
        - reportingStatus
        - timestamp
      description: Reporting status of the invoice

    ValidationResult:
      type: object
      properties:
        infoMessages:
          type: array
          items:
            $ref: '#/components/schemas/CustomValidationMessage'
          description: List of informational validation messages
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/CustomValidationMessage'
          description: List of error validation messages
        warningMessages:
          type: array
          items:
            $ref: '#/components/schemas/CustomValidationMessage'
          description: List of warning validation messages
        status:
          $ref: '#/components/schemas/ValidationStatus'
      required:
        - infoMessages
        - errorMessages
        - warningMessages
        - status

    CustomValidationMessage:
      type: object
      properties:
        type:
          type: string
          description: Type of the validation message
        code:
          type: string
          description: Code of the validation message
        category:
          type: string
          description: Category of the validation message
        message:
          type: string
          description: Text of the validation message
        status:
          type: string
          description: Status of the validation message
      required:
        - type
        - code
        - category
        - message
        - status
    ValidationStatus:
      type: string
      enum:
        - ACCEPTED
        - ACCEPTED_WITH_WARNING
        - REJECTED
      description: Status of the validation
    ReportingStatus:
      type: string
      enum:
        - REPORTED
        - NOT_REPORTED
      description: Reporting status of the invoice
    ClearanceStatus:
      type: string
      enum:
        - CLEARED
        - NOT_CLEARED
      description: Clearance status of the invoice

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    basicAuthCCSID:
      type: http
      scheme: basic
      description: "Username:  \n\n Password: p+4MfORNO4lYgP/RcpWz4riSQehkjPqArXOJglj1r/s="
    basicAuthPCSID:
      type: http
      scheme: basic
      description: "Username:  \n\n Password: yhuIq6qFEHn98jJzzE36+o/Gp56q5QeXF2FSfkBWCFQ="
      